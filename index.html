    <title>SCR Out Reports</title>
    <style>
      /* In-app splash: painted before any bundle loads, removed by src/splash.ts
         once React has rendered. Inline on purpose. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        background: #92caf6; /* sky colour sampled from the image, shown until it loads */
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      #splash img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/splash/splash.webp" alt="" decoding="async" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
